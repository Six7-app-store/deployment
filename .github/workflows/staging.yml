name: CD - Staging Deployment

# Baut den kompletten Staging-Stack bei jedem Merge auf `develop` neu auf
# (develop ist Staging, main ist Produktion - ADR 0013): OpenTofu reisst
# die alte VM ab und legt sie neu an, Ansible richtet sie ein. Nichts wird
# aktualisiert, alles wird ersetzt - der Stack ist danach in genau dem Zustand,
# den dieses Repository beschreibt, ohne von Hand gewachsene Reste.
#
# Laeuft auf dem self-hosted Runner (VM `github-runner`, 2001:7c0:1b20:c913:1::3f0).
# Das ist keine Vorliebe, sondern Notwendigkeit: die OpenStack-API der DHBW ist
# von ausserhalb des Campusnetzes nicht erreichbar, ein gehosteter GitHub-Runner
# laeuft dort in einen Timeout. Der Runner steht im Netz, der Rest nicht.
#
# Runner-VM und AppStore-VM sind bewusst zwei verschiedene Maschinen. Der Runner
# haelt den OpenTofu-State unter /var/lib/tofu-state/staging/ und wird von diesem
# OpenTofu nie angefasst - sonst wuerde `destroy` die eigene Grundlage
# wegraeumen.

on:
  # Merge auf develop in diesem Repository. main ist Produktion und loest
  # hier nichts aus.
  push:
    branches: [develop]

  # Merge auf develop in frontend, backend oder worker. Die schicken von ihrer CI
  # aus einen repository_dispatch hierher, sobald ihr Image in GHCR liegt.
  repository_dispatch:
    types: [trigger-deployment]

  workflow_dispatch:
    inputs:
      recreate:
        description: "VM vorher zerstoeren (aus = nur Aenderungen anwenden)"
        type: boolean
        default: true
      seed:
        description: "Seed-Daten anlegen (Benutzer, Kurse, Apps)"
        type: boolean
        default: false

# BEWUSST kein `pull_request`. Dieses Repository ist oeffentlich, und ein
# self-hosted Runner an einem PR-Trigger gaebe jedem, der einen Fork-PR oeffnet,
# eine Ausfuehrungsumgebung mit OpenStack-Zugang. push, workflow_dispatch und
# repository_dispatch kann ein Aussenstehender nicht ausloesen.

permissions:
  contents: read
  security-events: write

# Zwei Merges kurz hintereinander duerfen sich nicht ueberholen. Abgebrochen
# wird nichts: ein laufender destroy/apply ist nichts, das man auf halber
# Strecke stehen laesst.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging Deploy
    runs-on: [self-hosted, deploy]
    timeout-minutes: 90

    env:
      OS_AUTH_URL: ${{ secrets.STAGING_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.STAGING_OS_REGION_NAME }}
      OS_AUTH_TYPE: v3applicationcredential
      OS_IDENTITY_API_VERSION: '3'

      # OpenTofu laeuft ohne Terminal: kein Farbcode-Muell im Log, und eine
      # fehlende Variable bricht ab statt auf eine Eingabe zu warten, die nie
      # kommt. OpenTofu liest dieselben TF_*-Variablen wie Terraform.
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_CLI_ARGS: '-no-color'

      # Die Rollen aus requirements.yml liegen neben dem Playbook. ansible.cfg
      # zeigt mit roles_path schon dorthin; das hier haelt es auch dann richtig,
      # wenn ein Schritt aus einem anderen Verzeichnis startet.
      ANSIBLE_HOST_KEY_CHECKING: 'False'
      ANSIBLE_FORCE_COLOR: 'True'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pro Lauf installiert statt auf der Runner-VM: die Version steht damit
      # hier im Repository und ist dieselbe wie im Worker-Image
      # (TOFU_VERSION in worker/Dockerfile). Ohne Wrapper, weil die Schritte
      # unten `tofu output -raw` direkt in Variablen lesen.
      - name: OpenTofu installieren
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Ausloeser protokollieren
        run: |
          echo "Ereignis:   ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Ausgeloest von: ${{ github.event.client_payload.repository }}"
            echo "Commit:         ${{ github.event.client_payload.sha }}"
            echo "Nachricht:      ${{ github.event.client_payload.message }}"
          else
            echo "Commit:         ${{ github.sha }}"
          fi

      # Staging ist develop (ADR 0013). Steht in STAGING_ENV_FILE noch
      # *_VERSION=latest aus der alten Vorlage, zieht die VM den Stand von main -
      # den Produktionsstand -, und Merges auf develop kommen nie an. Die Werte
      # sind Image-Tags, kein Geheimnis. Ausgegeben als "NAME: wert", nicht als
      # "NAME=wert": GitHub maskiert ein mehrzeiliges Secret Zeile fuer Zeile,
      # und die Zeile selbst kaeme als *** im Log an.
      - name: Image-Tags pruefen
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          for v in BACKEND_VERSION WORKER_VERSION FRONTEND_VERSION; do
            wert=$(printf '%s\n' "$STAGING_ENV_FILE" | grep -E "^$v=" | head -1 | cut -d= -f2- || true)
            echo "$v: ${wert:-develop (Default aus docker-compose.staging.yml)}"
            if [ "$wert" = "latest" ]; then
              echo "::warning::$v steht in STAGING_ENV_FILE auf latest - Staging zieht damit den Produktionsstand. Zeile loeschen oder auf develop setzen (ADR 0013)."
            fi
          done

      # Billiger Kanarienvogel: wenn auf dem Runner ein Werkzeug fehlt, soll das
      # hier auffallen und nicht zwanzig Minuten spaeter mitten im apply.
      - name: Werkzeuge pruefen
        run: |
          tofu version
          ansible --version | head -1
          trivy --version | head -1
          nsupdate -V | head -1
          dig -v 2>&1 | head -1

      - name: OpenTofu Format Check
        working-directory: infrastructure/tofu
        run: tofu fmt -check -recursive

      # Staging ist absichtlich nicht blockierend: HIGH/CRITICAL-Funde werden
      # sichtbar gemacht, halten den Deploy aber nicht auf.
      # Trivy liest .tofu-Dateien als Terraform-Konfiguration (geprueft mit
      # 0.75.0: dieselben Befunde wie vorher an den .tf-Dateien).
      - name: OpenTofu Security Scan (Trivy)
        continue-on-error: true
        run: trivy config --severity HIGH,CRITICAL infrastructure/tofu

      - name: OpenTofu Security Scan (Trivy, SARIF)
        if: always()
        continue-on-error: true
        run: |
          trivy config --severity HIGH,CRITICAL \
            --format sarif --output trivy-iac.sarif infrastructure/tofu

      - name: Trivy-Ergebnisse an GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac-staging

      - name: SSH-Schluessel einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf erhaelt die Zeilenumbrueche des PEM; die Variable in
          # Anfuehrungszeichen haelt den Schluessel aus dem Skripttext heraus.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          # Der oeffentliche Schluessel wird aus dem privaten abgeleitet, damit
          # das OpenStack-Keypair immer zu dem Schluessel passt, mit dem Ansible
          # sich gleich verbindet.
          # -P '' erzwingt eine leere Passphrase: ein passphrase-geschuetzter
          # Schluessel scheitert so mit klarer Meldung, statt auf /dev/tty zu
          # haengen.
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      # Der State liegt unter /var/lib/tofu-state/staging/ auf dem Runner, nicht
      # im Workspace: actions/checkout raeumt den Workspace vor jedem Lauf, der
      # State muss aber ueber Laeufe hinweg bestehen. Siehe backend.tofu.
      #
      # Das Verzeichnis wird beim ersten Lauf angelegt und dem Runner-Nutzer
      # uebereignet - dieselbe Bauart wie /var/lib/caddy-backup weiter unten.
      # Der alte Terraform-State unter /var/lib/tf-state/ bleibt unberuehrt
      # (ADR 0010).
      - name: OpenTofu Init & Validate
        working-directory: infrastructure/tofu/envs/staging
        run: |
          if [ ! -d /var/lib/tofu-state/staging ]; then
            sudo mkdir -p /var/lib/tofu-state/staging
            sudo chown -R "$(id -u):$(id -g)" /var/lib/tofu-state
          fi
          tofu init
          tofu validate

      # Ohne diesen Schritt fordert Caddy nach jedem Neuaufbau ein neues
      # Zertifikat an: sein Datenverzeichnis liegt in einem Docker-Volume auf
      # der VM, und die ist gleich weg. Das kostet jedes Mal einen
      # ACME-Durchlauf, der erfahrungsgemaess beim ersten Versuch haengt.
      #
      # Die Sicherung landet auf der Runner-VM, also ausserhalb - dieselbe
      # Ueberlegung wie beim State in ADR-0003.
      #
      # continue-on-error, weil ein fehlender Vorgaenger kein Fehler ist: beim
      # allerersten Lauf gibt es keine alte VM, und ein neues Zertifikat
      # anzufordern ist dann richtig.
      - name: Caddy-Zertifikat der alten VM sichern
        continue-on-error: true
        working-directory: infrastructure/tofu/envs/staging
        run: |
          set -uo pipefail
          alt=$(tofu output -raw vm_ip 2>/dev/null || true)
          # Solange der alte Terraform-Stack noch steht (siehe den naechsten
          # Schritt), laeuft Staging auf dessen VM, und nur sein State kennt
          # ihre Adresse. Ohne diesen Rueckgriff ginge das Zertifikat beim
          # Abriss verloren.
          tf_alt=/var/lib/tf-state/staging/terraform.tfstate
          if [ -z "$alt" ] && [ -f "$tf_alt" ]; then
            alt=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("outputs",{}).get("vm_ip",{}).get("value",""))' "$tf_alt" || true)
          fi
          if [ -z "$alt" ]; then
            echo "Keine alte VM im State - nichts zu sichern."
            exit 0
          fi
          # sudo, weil der Runner unter /var/lib nichts anlegen darf. Ohne das
          # scheiterte der Schritt an `mkdir: Permission denied` - und weil er
          # continue-on-error traegt, blieb das unbemerkt: der Deploy lief
          # gruen weiter, die Sicherung entstand nie, das Zurueckspielen wurde
          # jedes Mal uebersprungen und jeder Neuaufbau bestellte ein frisches
          # Zertifikat. Genau das, was dieser Schritt verhindern soll.
          #
          # Einmal anlegen und uebereignen; danach ist es ein gewoehnliches
          # Verzeichnis des Runner-Nutzers. Dieselbe Bauart wie /var/lib/tofu-state.
          if [ ! -d /var/lib/caddy-backup ]; then
            sudo mkdir -p /var/lib/caddy-backup
            sudo chown "$(id -u):$(id -g)" /var/lib/caddy-backup
          fi
          # In eine Nebendatei schreiben und erst bei Erfolg umbenennen. Sonst
          # ueberschreibt ein fehlgeschlagener Versuch eine brauchbare
          # Sicherung mit einer leeren Datei.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i ~/.ssh/openstack-key "ubuntu@$alt" \
            'sudo docker run --rm -v app_caddy_data:/d alpine tar czf - -C /d .' \
            > /var/lib/caddy-backup/caddy_data.tgz.neu 2>/dev/null || true

          if [ -s /var/lib/caddy-backup/caddy_data.tgz.neu ]; then
            mv /var/lib/caddy-backup/caddy_data.tgz.neu \
               /var/lib/caddy-backup/caddy_data.tgz
            echo "Gesichert: $(du -h /var/lib/caddy-backup/caddy_data.tgz | cut -f1)"
          else
            rm -f /var/lib/caddy-backup/caddy_data.tgz.neu
            # Als Annotation, nicht als blosse Zeile im Log. Ein stiller
            # Fehlschlag hier kostet beim naechsten Mal eine ACME-Bestellung,
            # und die kann minutenlang haengen.
            echo "::warning::Kein Caddy-Zertifikat gesichert - der Neuaufbau bestellt ein frisches."
            echo "Nichts gesichert - vorhandene Sicherung bleibt unangetastet."
          fi

      # Einmalig, Nachtrag zu ADR 0010. Die ADR setzt voraus, dass Staging vor
      # dem Umstieg mit Terraform abgerissen wurde, und laesst OpenTofu mit
      # leerem State in /var/lib/tofu-state/ beginnen. Abgerissen wurde aber
      # nie: der letzte Terraform-Lauf (4.10., 8b808f1) hat VM, Schluessel und
      # Security Group angelegt, die nur im alten State stehen. Fuer OpenTofu
      # sind sie unsichtbar - sein destroy laesst sie stehen, sein apply
      # scheitert am vergebenen Schluesselnamen (409 "Key pair
      # 'staging-dhbw-appstore-key' already exists"), seit dem 5.10. bei
      # jedem Lauf. Staging lief derweil auf der alten VM weiter.
      #
      # Dieser Schritt reisst den alten Stack mit dem Code ab, der ihn
      # angelegt hat, und benennt den State danach um. Damit ist er beim
      # naechsten Lauf ein No-op und kann dann entfernt werden.
      #
      # Kein continue-on-error: scheitert der Abriss, wuerde das apply danach
      # ohnehin am selben Namen scheitern.
      - name: Alten Terraform-Stack abreissen (einmalig, ADR 0010)
        if: github.event_name != 'workflow_dispatch' || inputs.recreate
        run: |
          set -euo pipefail
          state=/var/lib/tf-state/staging/terraform.tfstate
          if [ ! -f "$state" ]; then
            echo "Kein alter Terraform-State - nichts abzureissen."
            exit 0
          fi
          anzahl=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("resources",[])))' "$state")
          echo "Alter Terraform-State: $anzahl Ressourcen."

          if [ "$anzahl" != 0 ]; then
            # Der Code, der den Stack angelegt hat: der letzte Stand vor der
            # Umstellung. Die heutige Kopie unter infrastructure/terraform/
            # enthaelt envs/staging nicht mehr.
            alt_code="$RUNNER_TEMP/terraform-staging-alt"
            rm -rf "$alt_code" && mkdir -p "$alt_code"
            git fetch --no-tags --depth 1 origin 8b808f12a162bb2cebd8ec7cd038c2a805386109
            git archive FETCH_HEAD infrastructure/terraform | tar -x -C "$alt_code"

            # Mit dem Werkzeug, das den State geschrieben hat, solange es auf
            # dem Runner liegt. OpenTofu liest Terraform-States ebenfalls und
            # ist der Rueckfall.
            tf=terraform
            command -v terraform >/dev/null || tf=tofu
            echo "Abriss mit: $($tf version | head -1)"

            cd "$alt_code/infrastructure/terraform/envs/staging"
            "$tf" init
            "$tf" destroy -auto-approve
          fi

          # Umbenennen statt loeschen: falls doch etwas schiefging, bleibt
          # nachvollziehbar, was in diesem State stand.
          ziel="$state.abgerissen-$(date +%Y%m%d-%H%M%S)"
          mv "$state" "$ziel" 2>/dev/null || sudo mv "$state" "$ziel"
          echo "Alter State umbenannt - dieser Schritt ist ab jetzt ein No-op."

      # Der eigentliche Punkt dieses Workflows: die alte VM verschwindet
      # vollstaendig, bevor die neue entsteht. Kein In-place-Update, keine
      # Reste aus frueheren Laeufen.
      #
      # Beim allerersten Lauf ist der State leer und destroy ein No-op - das
      # ist kein Fehler.
      - name: OpenTofu Destroy (alten Stack abreissen)
        if: github.event_name != 'workflow_dispatch' || inputs.recreate
        working-directory: infrastructure/tofu/envs/staging
        run: tofu destroy -auto-approve

      - name: OpenTofu Plan & Apply (neuen Stack aufbauen)
        working-directory: infrastructure/tofu/envs/staging
        run: |
          tofu plan -out=tfplan
          tofu apply tfplan
          echo "VM_IP=$(tofu output -raw vm_ip)" >> "$GITHUB_ENV"
          echo "VM_IPV4=$(tofu output -raw vm_ipv4)" >> "$GITHUB_ENV"
          echo "VM_IPV4_GATEWAY=$(tofu output -raw vm_ipv4_gateway)" >> "$GITHUB_ENV"
          echo "VM_IPV4_MAC=$(tofu output -raw vm_ipv4_mac)" >> "$GITHUB_ENV"

      # Ohne diesen Schritt ist der Neuaufbau wertlos: die neue VM bekommt eine
      # neue IPv6-Adresse, der AAAA-Record zeigt aber weiter auf die alte, und
      # unter dem Hostnamen ist nichts mehr erreichbar. Genau so ist der erste
      # automatische Deploy am 18.09.2026 geendet.
      #
      # Das Runbook fuehrte den DNS-Eintrag als Schritt "nur beim ersten Mal" -
      # unter der Annahme, die VM bleibe bestehen. Seit sie das nicht mehr tut,
      # gehoert der Eintrag in jeden Lauf.
      #
      # Caddy benutzt denselben TSIG-Schluessel fuer den TXT-Record der
      # dns-01-Pruefung. Er darf nachweislich auch AAAA schreiben.
      - name: DNS-Eintrag auf die neue VM zeigen lassen
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          envfile=$(mktemp)
          keyfile=$(mktemp)
          # Beide Dateien enthalten Geheimnisse und verschwinden auch dann,
          # wenn nsupdate abbricht.
          trap 'rm -f "$envfile" "$keyfile"' EXIT
          printf '%s\n' "$STAGING_ENV_FILE" > "$envfile"

          wert() { grep -E "^$1=" "$envfile" | head -1 | cut -d= -f2- || true; }
          hostname=$(wert APP_HOSTNAME)
          keyname=$(wert DNS_TSIG_KEY_NAME)
          keysecret=$(wert DNS_TSIG_KEY)
          # DNS_SERVER und DNS_TSIG_KEY_ALG stehen ueblicherweise nicht in der
          # .env - die Defaults hier sind dieselben wie in
          # docker-compose.staging.yml, damit Caddy und dieser Schritt nicht
          # auseinanderlaufen koennen.
          server=$(wert DNS_SERVER); server=${server:-ns.cloud-ns.dhbw-mannheim.de.:53}
          alg=$(wert DNS_TSIG_KEY_ALG); alg=${alg:-hmac-sha512}
          nshost=${server%:*}
          nsport=${server##*:}

          for v in hostname keyname keysecret; do
            if [ -z "${!v}" ]; then
              echo "::error::$v fehlt in STAGING_ENV_FILE - der DNS-Eintrag kann nicht gesetzt werden." >&2
              exit 1
            fi
          done

          # Der Schluessel geht ueber eine Datei, nicht ueber -y: die
          # Kommandozeile waere auf dieser dauerhaften Maschine fuer jeden
          # sichtbar, der zur selben Zeit `ps` aufruft.
          cat > "$keyfile" <<KEY
          key "$keyname" {
              algorithm $alg;
              secret "$keysecret";
          };
          KEY

          # Die Zone wird nicht geraten, sondern beim autoritativen Server
          # erfragt. Ein falscher zone-Eintrag laesst nsupdate mit NOTZONE
          # scheitern, und das sieht aus wie ein Rechteproblem.
          zone=$(dig +noall +authority +answer SOA "$hostname" @"$nshost" -p "$nsport" \
                 | awk '$4=="SOA"{print $1; exit}')
          if [ -z "$zone" ]; then
            echo "::error::Zu $hostname liess sich keine Zone ermitteln." >&2
            exit 1
          fi
          echo "Zone: $zone"
          echo "Setze $hostname auf $VM_IP"

          nsupdate -k "$keyfile" <<UPDATE
          server $nshost $nsport
          zone $zone
          update delete $hostname. AAAA
          update add $hostname. 300 AAAA $VM_IP
          send
          UPDATE

          # Nachsehen statt hoffen. Gefragt wird der autoritative Server
          # direkt, damit kein Zwischenspeicher eine alte Antwort liefert.
          gesetzt=$(dig +short AAAA "$hostname" @"$nshost" -p "$nsport" | head -1)
          if [ "$gesetzt" != "$VM_IP" ]; then
            echo "::error::DNS zeigt auf '$gesetzt', erwartet war '$VM_IP'." >&2
            exit 1
          fi
          echo "AAAA-Record steht auf $gesetzt."
          echo "APP_HOSTNAME=$hostname" >> "$GITHUB_ENV"

      # OpenTofu meldet die VM als fertig, sobald Nova sie als ACTIVE fuehrt.
      # Bis der SSH-Dienst darin antwortet, vergehen noch einige Sekunden -
      # ohne dieses Warten scheitert Ansible am ersten Verbindungsversuch.
      - name: Auf SSH der neuen VM warten
        run: |
          for i in $(seq 1 60); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                   -i ~/.ssh/openstack-key "ubuntu@${VM_IP}" true 2>/dev/null; then
              echo "SSH ist nach ${i} Versuchen da."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Die neue VM antwortet nach 10 Minuten nicht auf SSH." >&2
          exit 1

      - name: Ansible-Abhaengigkeiten installieren
        working-directory: infrastructure/ansible
        run: |
          ansible-galaxy role install -r requirements.yml -p roles_external
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible-Inventar erzeugen
        working-directory: infrastructure/ansible
        run: |
          # Leer heisst: tofu hat keinen Output geliefert. ansible-playbook
          # wuerde dann mit "no hosts matched" gruen durchlaufen und nichts
          # ausrollen - ein gruener Lauf ohne Deploy ist schlimmer als ein roter.
          if [ -z "$VM_IP" ]; then
            echo "::error::VM_IP ist leer - tofu output hat nichts geliefert." >&2
            exit 1
          fi
          # Die Adresse steht in ansible_host hinter einem Alias, nicht als
          # Hostname selbst: eckige Klammern um ein IPv6-Literal liest das
          # ini-Plugin als Host-Range und scheitert mit "host range must be
          # begin:end". Ein Alias umgeht die Frage und ist fuer IPv4 und IPv6
          # gleich.
          cat > inventory.ini <<EOF
          [docker_vm]
          staging ansible_host=${VM_IP} ansible_user=ubuntu
          EOF
          echo "Inventar:" && cat inventory.ini

      - name: Ansible Playbook ausfuehren
        working-directory: infrastructure/ansible
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          # Bei einem frisch aufgebauten Stack existieren noch keine Benutzer,
          # Kurse oder Apps - der Keycloak-Realm bringt nur das Dienstkonto des
          # Backends mit. Nach einem destroy/apply muss also geseedet werden,
          # sonst steht der App-Store leer da. Das Skript ist idempotent.
          #
          # Die Bedingung ist absichtlich herum: `event == 'workflow_dispatch'
          # && inputs.seed || 'true'` waere falsch. GitHubs || liefert den
          # ersten wahrheitswerthaltigen Operanden, und bei seed=false ergaebe
          # `false || 'true'` wieder 'true' - die Wahl im Formular haette keine
          # Wirkung. So herum steht der Default links und wird nur dann
          # ausgewertet, wenn es kein workflow_dispatch ist.
          SEED: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.seed }}
        run: |
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key \
            -e seed_data=${SEED} \
            -e "secondary_ipv4=${VM_IPV4}" \
            -e "secondary_gateway=${VM_IPV4_GATEWAY}" \
            -e "secondary_mac=${VM_IPV4_MAC}" \
            staging.yml

      - name: Ergebnis
        if: success()
        run: |
          {
            echo "### Staging neu aufgebaut"
            echo ""
            echo "**https://${APP_HOSTNAME}**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| VM-Adresse | \`${VM_IP}\` |"
            echo "| Ausgeloest durch | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Laeuft auch nach einem Abbruch. Der Runner ist eine dauerhafte Maschine,
      # kein wegwerfbarer Container - was hier liegen bleibt, bleibt liegen.
      - name: Sensible Dateien entfernen
        if: always()
