name: CD - Staging Deployment

# Baut einen Stand des Stacks bei jedem Merge neu auf: OpenTofu reisst die
# alte VM ab und legt sie neu an, Ansible richtet sie ein. Nichts wird
# aktualisiert, alles wird ersetzt - der Stack ist danach in genau dem Zustand,
# den dieses Repository beschreibt, ohne von Hand gewachsene Reste.
#
# Es gibt zwei Staende, je Branch einen (ADR 0014):
#
#   develop  Staging. Eigene VM, eigener Hostname, eigene Datenbanken,
#            Images :develop.
#   main     Der Stand unter der bisherigen Staging-Adresse. Images :latest.
#            VM, State und Hostname sind dieselben wie vor ADR 0014.
#
# Welcher Stand gebaut wird, bestimmt der Branch des Ausloesers. Die
# Produktion aus docker-compose.prod.yml faehrt weiterhin eine Person von Hand.
#
# Laeuft auf dem self-hosted Runner (VM `github-runner`, 2001:7c0:1b20:c913:1::3f0).
# Das ist keine Vorliebe, sondern Notwendigkeit: die OpenStack-API der DHBW ist
# von ausserhalb des Campusnetzes nicht erreichbar, ein gehosteter GitHub-Runner
# laeuft dort in einen Timeout. Der Runner steht im Netz, der Rest nicht.
#
# Runner-VM und AppStore-VM sind bewusst zwei verschiedene Maschinen. Der Runner
# haelt den OpenTofu-State unter /var/lib/tofu-state/<stand>/ und wird von diesem
# OpenTofu nie angefasst - sonst wuerde `destroy` die eigene Grundlage
# wegraeumen.

on:
  # Merge in diesem Repository. Der Branch ist der Stand.
  push:
    branches: [develop, main]

  # Merge in frontend, backend oder worker. Die schicken von ihrer CI aus einen
  # repository_dispatch hierher, sobald ihr Image in GHCR liegt, und nennen in
  # client_payload.ref den Branch, auf dem gemergt wurde.
  repository_dispatch:
    types: [trigger-deployment]

  workflow_dispatch:
    inputs:
      stand:
        description: "Welcher Stand neu gebaut wird"
        type: choice
        options: [develop, main]
        default: develop
      recreate:
        description: "VM vorher zerstoeren (aus = nur Aenderungen anwenden)"
        type: boolean
        default: true
      seed:
        description: "Seed-Daten anlegen (Benutzer, Kurse, Apps)"
        type: boolean
        default: false
      bootstrap_guarded:
        description: "Ausgewaehlter Stand: alten Timer sicher durch geschuetzte Variante ersetzen"
        type: boolean
        default: false
      bootstrap_resume_owner:
        description: "Nur nach Fehler: Wartungseigentuemer des vorherigen Laufs"
        type: string
        default: ""

# BEWUSST kein `pull_request`. Dieses Repository ist oeffentlich, und ein
# self-hosted Runner an einem PR-Trigger gaebe jedem, der einen Fork-PR oeffnet,
# eine Ausfuehrungsumgebung mit OpenStack-Zugang. push, workflow_dispatch und
# repository_dispatch kann ein Aussenstehender nicht ausloesen.

permissions:
  contents: read
  security-events: write

jobs:
  deploy:
    name: Staging Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.stand || (github.event_name == 'push' && github.ref_name == 'main' && 'main') || (github.event.client_payload.ref == 'refs/heads/main' && 'main') || 'develop' }})
    runs-on: [self-hosted, deploy]
    timeout-minutes: 90

    # Zwei Merges kurz hintereinander duerfen sich nicht ueberholen. Abgebrochen
    # wird nichts: ein laufender destroy/apply ist nichts, das man auf halber
    # Strecke stehen laesst.
    #
    # Eine Gruppe je Stand, nicht eine fuer beide: GitHub haelt je Gruppe nur
    # einen wartenden Lauf und verwirft den aelteren. Mit einer gemeinsamen
    # Gruppe koennte ein develop-Merge den wartenden main-Deploy verdraengen.
    # Gleichzeitig laufen beide trotzdem nicht - es gibt genau einen Runner.
    concurrency:
      group: staging-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stand || (github.event_name == 'push' && github.ref_name == 'main' && 'main') || (github.event.client_payload.ref == 'refs/heads/main' && 'main') || 'develop' }}
      cancel-in-progress: false

    env:
      # Der Stand dieses Laufs, develop oder main. Dieselbe Ableitung wie im
      # Namen und in der concurrency-Gruppe oben: workflow_dispatch nennt ihn
      # ausdruecklich, push ueber den Branch, repository_dispatch ueber
      # client_payload.ref. Alles Unbekannte ist develop - ein Ausloeser ohne
      # Branchangabe soll nie den main-Stand abreissen.
      STAND: ${{ github.event_name == 'workflow_dispatch' && inputs.stand || (github.event_name == 'push' && github.ref_name == 'main' && 'main') || (github.event.client_payload.ref == 'refs/heads/main' && 'main') || 'develop' }}

      OS_AUTH_URL: ${{ secrets.STAGING_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.STAGING_OS_REGION_NAME }}
      OS_AUTH_TYPE: v3applicationcredential
      OS_IDENTITY_API_VERSION: '3'

      # OpenTofu laeuft ohne Terminal: kein Farbcode-Muell im Log, und eine
      # fehlende Variable bricht ab statt auf eine Eingabe zu warten, die nie
      # kommt. OpenTofu liest dieselben TF_*-Variablen wie Terraform.
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_CLI_ARGS: '-no-color'

      # Die Rollen aus requirements.yml liegen neben dem Playbook. ansible.cfg
      # zeigt mit roles_path schon dorthin; das hier haelt es auch dann richtig,
      # wenn ein Schritt aus einem anderen Verzeichnis startet.
      ANSIBLE_HOST_KEY_CHECKING: 'False'
      ANSIBLE_FORCE_COLOR: 'True'

    steps:
      # Gebaut wird mit Compose-Datei, OpenTofu und Playbook des Stands, nicht
      # mit denen des Workflows. repository_dispatch und workflow_dispatch
      # laufen immer mit dem Workflow vom Standardbranch (develop); ohne `ref`
      # baute ein main-Deploy aus fremden Repos mit der Konfiguration von
      # develop. Bei push ist es genau der gemergte Commit.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.STAND }}

      # Pro Lauf installiert statt auf der Runner-VM: die Version steht damit
      # hier im Repository und ist dieselbe wie im Worker-Image
      # (TOFU_VERSION in worker/Dockerfile). Ohne Wrapper, weil die Schritte
      # unten `tofu output -raw` direkt in Variablen lesen.
      - name: OpenTofu installieren
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Ausloeser protokollieren
        run: |
          echo "Stand:      $STAND"
          echo "Ereignis:   ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Ausgeloest von: ${{ github.event.client_payload.repository }}"
            echo "Branch:         ${{ github.event.client_payload.ref }}"
            echo "Commit:         ${{ github.event.client_payload.sha }}"
            echo "Nachricht:      ${{ github.event.client_payload.message }}"
          else
            echo "Commit:         ${{ github.sha }}"
          fi

      # Alles, worin sich die beiden Staende unterscheiden, an einer Stelle.
      #
      # main behaelt Namen, State, Zertifikatssicherung und Hostname von vor
      # ADR 0014 - deshalb steht dort "staging" und nicht "main". Umbenennen
      # hiesse, den State umzuziehen, ohne dass sich irgendetwas verbessert.
      - name: Stand festlegen
        run: |
          set -euo pipefail
          case "$STAND" in
            main)
              prefix=staging
              tag=latest
              caddy=/var/lib/caddy-backup/caddy_data.tgz
              ;;
            develop)
              prefix=develop
              tag=develop
              caddy=/var/lib/caddy-backup/develop/caddy_data.tgz
              ;;
            *)
              echo "::error::Unbekannter Stand '$STAND'." >&2
              exit 1
              ;;
          esac
          {
            echo "TF_VAR_name_prefix=$prefix"
            echo "STATE_DIR=/var/lib/tofu-state/$prefix"
            echo "IMAGE_TAG=$tag"
            echo "CADDY_BACKUP=$caddy"
          } | tee -a "$GITHUB_ENV"

      # Beide Staende kommen aus demselben Secret STAGING_ENV_FILE. Fuer develop
      # wird daraus eine eigene .env abgeleitet, damit niemand ein zweites
      # Secret mit denselben dreissig Werten von Hand pflegen muss:
      #
      #   - der Hostname wird ueberall ersetzt, wo er vorkommt (APP_HOSTNAME,
      #     APP_BASE_URL, VITE_*, CORS_ORIGINS). Default ist "staging." vor der
      #     Zone des main-Hostnamens, abweichend ueber die Repository-Variable
      #     DEVELOP_APP_HOSTNAME.
      #   - DB_NAME, KEYCLOAK_DB_NAME und TFSTATE_DB_NAME bekommen "_develop"
      #     angehaengt. Die drei Datenbanken liegen fuer beide Staende in
      #     derselben Postgres-Instanz auf dem Runner (ADR 0005, 0006). Teilten
      #     sie sich eine Datenbank, migrierte develop die Daten von main, und
      #     der develop-Worker saehe die OpenTofu-States der Deployments von
      #     main - und koennte sie abreissen.
      #
      # Wer develop doch anders konfigurieren will, legt das Secret
      # DEVELOP_ENV_FILE an; dann gilt es unveraendert.
      #
      # Die Image-Tags setzt der Stand, nicht das Secret: develop zieht
      # :develop, main zieht :latest. Ein Tag im Secret wird ueberschrieben.
      - name: Env-Datei des Stands erzeugen
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          DEVELOP_ENV_FILE: ${{ secrets.DEVELOP_ENV_FILE }}
          DEVELOP_APP_HOSTNAME: ${{ vars.DEVELOP_APP_HOSTNAME }}
        run: |
          set -euo pipefail
          umask 077
          datei="$RUNNER_TEMP/stand.env"
          wert() { grep -E "^$1=" "$datei" | head -1 | cut -d= -f2- || true; }

          if [ "$STAND" = develop ] && [ -n "$DEVELOP_ENV_FILE" ]; then
            printf '%s\n' "$DEVELOP_ENV_FILE" > "$datei"
            echo "develop: DEVELOP_ENV_FILE gilt unveraendert."
          else
            printf '%s\n' "$STAGING_ENV_FILE" > "$datei"
          fi

          if [ "$STAND" = develop ] && [ -z "$DEVELOP_ENV_FILE" ]; then
            alt=$(wert APP_HOSTNAME)
            if [ -z "$alt" ]; then
              echo "::error::APP_HOSTNAME fehlt in STAGING_ENV_FILE." >&2
              exit 1
            fi
            neu=${DEVELOP_APP_HOSTNAME:-staging.${alt#*.}}
            if [ "$neu" = "$alt" ]; then
              echo "::error::develop bekaeme denselben Hostnamen wie main ($alt)." >&2
              exit 1
            fi
            # Punkte im Muster maskieren, sonst passt "." auf jedes Zeichen.
            muster=$(printf '%s' "$alt" | sed 's/[.]/\\./g')
            sed -i "s/$muster/$neu/g" "$datei"
            echo "Hostname: $alt -> $neu"

            for v in DB_NAME KEYCLOAK_DB_NAME TFSTATE_DB_NAME; do
              name=$(wert "$v")
              if [ -z "$name" ]; then
                echo "::error::$v fehlt in STAGING_ENV_FILE." >&2
                exit 1
              fi
              sed -i "s/^$v=.*/$v=${name}_develop/" "$datei"
              echo "$v: ${name}_develop"
            done
          fi

          sed -i -E '/^(BACKEND|WORKER|FRONTEND)_VERSION=/d' "$datei"
          for v in BACKEND_VERSION WORKER_VERSION FRONTEND_VERSION; do
            echo "$v=$IMAGE_TAG" >> "$datei"
          done
          # "NAME: wert", nicht "NAME=wert": GitHub maskiert ein mehrzeiliges
          # Secret Zeile fuer Zeile, und die Zeile kaeme als *** im Log an.
          echo "Image-Tags: $IMAGE_TAG"
          echo "APP_HOSTNAME: $(wert APP_HOSTNAME)"
          echo "STAND_ENV_FILE=$datei" >> "$GITHUB_ENV"

      # develop hat eigene Datenbanken in der Postgres-Instanz des Runners
      # (siehe oben). Sie werden hier angelegt, sobald es sie nicht gibt -
      # beim ersten develop-Lauf also, danach ist der Schritt ein No-op.
      # Eigentuemer sind dieselben Rollen wie bei main; neue Rollen braeuchten
      # neue Passwoerter, und die stuenden dann doch wieder in einem Secret.
      #
      # Fuer main laeuft der Schritt nicht. Dessen Datenbanken gibt es, und
      # nichts in diesem Workflow soll sie anfassen.
      - name: Datenbanken fuer develop anlegen
        if: env.STAND == 'develop'
        run: |
          set -euo pipefail
          wert() { grep -E "^$1=" "$STAND_ENV_FILE" | head -1 | cut -d= -f2- || true; }

          # Die Datenbanken liegen nur dann auf dieser Maschine, wenn die .env
          # auf den Runner zeigt (Default in docker-compose.staging.yml).
          for h in DB_HOST KEYCLOAK_DB_HOST TFSTATE_DB_HOST; do
            ziel=$(wert "$h")
            if [ -n "$ziel" ] && [ "$ziel" != 10.200.1.55 ]; then
              echo "::error::$h zeigt auf $ziel, nicht auf den Runner - die develop-Datenbanken lassen sich hier nicht anlegen. DEVELOP_ENV_FILE mit eigenen Datenbanken setzen." >&2
              exit 1
            fi
          done

          for paar in DB_NAME:DB_USER KEYCLOAK_DB_NAME:KEYCLOAK_DB_USER TFSTATE_DB_NAME:TFSTATE_DB_USER; do
            db=$(wert "${paar%%:*}")
            rolle=$(wert "${paar##*:}")
            vorhanden=$(sudo -n -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")
            if [ "$vorhanden" = 1 ]; then
              echo "$db: vorhanden"
            else
              # createdb statt CREATE DATABASE: Name und Eigentuemer gehen als
              # Argumente hinein, nicht als SQL-Text.
              sudo -n -u postgres createdb --owner="$rolle" "$db"
              echo "$db: angelegt, Eigentuemer $rolle"
            fi
          done

          # pg_hba.conf entscheidet, ob die VM die neuen Datenbanken ueberhaupt
          # erreichen darf. Steht dort statt "all" eine Liste von
          # Datenbanknamen, scheitert spaeter Backend oder Keycloak mit "no
          # pg_hba.conf entry". Die Datei enthaelt keine Geheimnisse.
          echo "Aktive Zeilen in pg_hba.conf:"
          sudo -n grep -vE '^[[:space:]]*(#|$)' /etc/postgresql/16/main/pg_hba.conf || true

      # Billiger Kanarienvogel: wenn auf dem Runner ein Werkzeug fehlt, soll das
      # hier auffallen und nicht zwanzig Minuten spaeter mitten im apply.
      - name: Werkzeuge pruefen
        run: |
          tofu version
          ansible --version | head -1
          trivy --version | head -1
          nsupdate -V | head -1
          dig -v 2>&1 | head -1
          psql --version

      - name: OpenTofu Format Check
        working-directory: infrastructure/tofu
        run: tofu fmt -check -recursive

      # Staging ist absichtlich nicht blockierend: HIGH/CRITICAL-Funde werden
      # sichtbar gemacht, halten den Deploy aber nicht auf.
      # Trivy liest .tofu-Dateien als Terraform-Konfiguration (geprueft mit
      # 0.75.0: dieselben Befunde wie vorher an den .tf-Dateien).
      - name: OpenTofu Security Scan (Trivy)
        continue-on-error: true
        run: trivy config --severity HIGH,CRITICAL infrastructure/tofu

      - name: OpenTofu Security Scan (Trivy, SARIF)
        if: always()
        continue-on-error: true
        run: |
          trivy config --severity HIGH,CRITICAL \
            --format sarif --output trivy-iac.sarif infrastructure/tofu

      - name: Trivy-Ergebnisse an GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac-staging

      - name: SSH-Schluessel einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf erhaelt die Zeilenumbrueche des PEM; die Variable in
          # Anfuehrungszeichen haelt den Schluessel aus dem Skripttext heraus.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          # Der oeffentliche Schluessel wird aus dem privaten abgeleitet, damit
          # das OpenStack-Keypair immer zu dem Schluessel passt, mit dem Ansible
          # sich gleich verbindet.
          # -P '' erzwingt eine leere Passphrase: ein passphrase-geschuetzter
          # Schluessel scheitert so mit klarer Meldung, statt auf /dev/tty zu
          # haengen.
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      # Der State liegt unter /var/lib/tofu-state/<stand>/ auf dem Runner, nicht
      # im Workspace: actions/checkout raeumt den Workspace vor jedem Lauf, der
      # State muss aber ueber Laeufe hinweg bestehen. Siehe backend.tofu.
      #
      # Beide Staende benutzen dasselbe envs/staging, nur der State-Pfad
      # unterscheidet sich - der kommt ueber -backend-config, weil ein
      # backend-Block keine Variablen kennt.
      #
      # Das Verzeichnis wird beim ersten Lauf angelegt und dem Runner-Nutzer
      # uebereignet - dieselbe Bauart wie /var/lib/caddy-backup weiter unten.
      - name: OpenTofu Init & Validate
        working-directory: infrastructure/tofu/envs/staging
        run: |
          if [ ! -d "$STATE_DIR" ]; then
            sudo mkdir -p "$STATE_DIR"
            sudo chown -R "$(id -u):$(id -g)" /var/lib/tofu-state
          fi
          tofu init -reconfigure -backend-config="path=$STATE_DIR/terraform.tfstate"
          tofu validate

      # Bootstrap is an explicit, non-destructive run of the selected stand.
      - name: Bootstrap-Eingaben pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded
        env:
          RECREATE_INPUT: ${{ inputs.recreate }}
          SEED_INPUT: ${{ inputs.seed }}
          GUARD_ENABLED: ${{ (env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true') }}
          RESUME_OWNER: ${{ inputs.bootstrap_resume_owner }}
        run: |
          set -euo pipefail
          if { [ "$STAND" != develop ] && [ "$STAND" != main ]; } || [ "$RECREATE_INPUT" != false ] || [ "$SEED_INPUT" != false ] || [ "$GUARD_ENABLED" = true ]; then
            echo '::error::Bootstrap requires develop or main, recreate=false, seed=false and guarded updates not yet enabled for the selected stand.'
            exit 1
          fi
          if [ -n "$RESUME_OWNER" ] && ! [[ "$RESUME_OWNER" =~ ^gha-[0-9]+-[0-9]+$ ]]; then
            echo '::error::Invalid previous maintenance owner.'
            exit 1
          fi

      # Opt-in after a separate bootstrap: the current backend AND any active
      # timer must already support the same durable maintenance gate.
      - name: Laufende App-Auftraege vor Plattform-Neubau schuetzen
        if: (env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded)
        working-directory: infrastructure/tofu/envs/staging
        env:
          BOOTSTRAP_GUARDED: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded }}
          RESUME_OWNER: ${{ inputs.bootstrap_resume_owner }}
        run: |
          set -euo pipefail
          old_ip=$(tofu output -raw vm_ip 2>/dev/null || true)
          if [ -n "$old_ip" ]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i ~/.ssh/openstack-key "ubuntu@$old_ip" \
              'docker exec backend-prod python -c "import app.services.maintenance_control"' \
              > /dev/null 2>&1 \
              || { echo '::error::Backend does not support the maintenance guard.'; exit 1; }
            if [ "$BOOTSTRAP_GUARDED" = true ]; then
              # Stop the old timer and wait for any already-started update to
              # finish. No running updater is killed or interrupted.
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                -i ~/.ssh/openstack-key "ubuntu@$old_ip" \
                'sudo -n bash -s' < ../../../../scripts/quiesce-autoupdate.sh \
                || { echo '::error::Could not safely stop the legacy timer; bootstrap aborted.'; exit 1; }
            else
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                -i ~/.ssh/openstack-key "ubuntu@$old_ip" \
                '{ ! systemctl is-active --quiet appstore-autoupdate.timer || grep -q appstore-guarded-autoupdate.py /usr/local/bin/appstore-autoupdate; }' \
                > /dev/null 2>&1 \
                || { echo '::error::Active timer is not protected by the maintenance guard.'; exit 1; }
            fi
          fi
          db=$(grep -E '^DB_NAME=' "$STAND_ENV_FILE" | head -1 | cut -d= -f2-)
          [[ "$db" =~ ^[a-zA-Z0-9_]+$ ]] || { echo '::error::Invalid DB_NAME'; exit 1; }
          owner="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          action=begin
          if [ "$BOOTSTRAP_GUARDED" = true ] && [ -n "$RESUME_OWNER" ]; then
            owner=$RESUME_OWNER
            action=resume
          fi
          echo "MAINTENANCE_DB=$db" >> "$GITHUB_ENV"
          echo "MAINTENANCE_OWNER=$owner" >> "$GITHUB_ENV"
          echo "Maintenance owner: $owner"
          bash ../../../../scripts/maintenance-operator.sh "$action" "$db" "$owner" 600
          if [ -n "$old_ip" ]; then
            if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                 -i ~/.ssh/openstack-key "ubuntu@$old_ip" \
                 'docker exec backend-prod python -m app.services.maintenance_control verify-workers' \
                 > /dev/null 2>&1 ||
               ! ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                 -i ~/.ssh/openstack-key "ubuntu@$old_ip" \
                 'docker exec rabbitmq-prod sh -c '\''exec rabbitmqctl list_queues -q -p "$RABBITMQ_DEFAULT_VHOST" name messages_ready messages_unacknowledged'\''' \
                 2>/dev/null | python3 ../../../../scripts/check_broker_queues.py; then
              if [ "$action" = begin ]; then
                bash ../../../../scripts/maintenance-operator.sh end "$db" "$owner" || true
              fi
              echo '::error::Workers or broker busy or unreachable; deployment not started.'
              exit 1
            fi
          fi

      # Ohne diesen Schritt fordert Caddy nach jedem Neuaufbau ein neues
      # Zertifikat an: sein Datenverzeichnis liegt in einem Docker-Volume auf
      # der VM, und die ist gleich weg. Das kostet jedes Mal einen
      # ACME-Durchlauf, der erfahrungsgemaess beim ersten Versuch haengt.
      #
      # Die Sicherung landet auf der Runner-VM, also ausserhalb - dieselbe
      # Ueberlegung wie beim State in ADR-0003.
      #
      # continue-on-error, weil ein fehlender Vorgaenger kein Fehler ist: beim
      # allerersten Lauf gibt es keine alte VM, und ein neues Zertifikat
      # anzufordern ist dann richtig.
      - name: Caddy-Zertifikat der alten VM sichern
        if: ${{ !((github.event_name == 'repository_dispatch' && ((env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded)) }}
        continue-on-error: true
        working-directory: infrastructure/tofu/envs/staging
        run: |
          set -uo pipefail
          alt=$(tofu output -raw vm_ip 2>/dev/null || true)
          if [ -z "$alt" ]; then
            echo "Keine alte VM im State - nichts zu sichern."
            exit 0
          fi
          # sudo, weil der Runner unter /var/lib nichts anlegen darf. Ohne das
          # scheiterte der Schritt an `mkdir: Permission denied` - und weil er
          # continue-on-error traegt, blieb das unbemerkt: der Deploy lief
          # gruen weiter, die Sicherung entstand nie, das Zurueckspielen wurde
          # jedes Mal uebersprungen und jeder Neuaufbau bestellte ein frisches
          # Zertifikat. Genau das, was dieser Schritt verhindern soll.
          #
          # Einmal anlegen und uebereignen; danach ist es ein gewoehnliches
          # Verzeichnis des Runner-Nutzers. Dieselbe Bauart wie /var/lib/tofu-state.
          # Je Stand eine eigene Datei (CADDY_BACKUP): das Zertifikat gilt nur
          # fuer dessen Hostnamen.
          verzeichnis=$(dirname "$CADDY_BACKUP")
          if [ ! -d "$verzeichnis" ]; then
            sudo mkdir -p "$verzeichnis"
            sudo chown "$(id -u):$(id -g)" /var/lib/caddy-backup "$verzeichnis"
          fi
          # In eine Nebendatei schreiben und erst bei Erfolg umbenennen. Sonst
          # ueberschreibt ein fehlgeschlagener Versuch eine brauchbare
          # Sicherung mit einer leeren Datei.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i ~/.ssh/openstack-key "ubuntu@$alt" \
            'sudo docker run --rm -v app_caddy_data:/d alpine tar czf - -C /d .' \
            > "$CADDY_BACKUP.neu" 2>/dev/null || true

          if [ -s "$CADDY_BACKUP.neu" ]; then
            mv "$CADDY_BACKUP.neu" "$CADDY_BACKUP"
            echo "Gesichert: $(du -h "$CADDY_BACKUP" | cut -f1)"
          else
            rm -f "$CADDY_BACKUP.neu"
            # Als Annotation, nicht als blosse Zeile im Log. Ein stiller
            # Fehlschlag hier kostet beim naechsten Mal eine ACME-Bestellung,
            # und die kann minutenlang haengen.
            echo "::warning::Kein Caddy-Zertifikat gesichert - der Neuaufbau bestellt ein frisches."
            echo "Nichts gesichert - vorhandene Sicherung bleibt unangetastet."
          fi

      # Der eigentliche Punkt dieses Workflows: die alte VM verschwindet
      # vollstaendig, bevor die neue entsteht. Kein In-place-Update, keine
      # Reste aus frueheren Laeufen.
      #
      # Beim allerersten Lauf ist der State leer und destroy ein No-op - das
      # ist kein Fehler.
      - name: OpenTofu Destroy (alten Stack abreissen)
        if: (github.event_name != 'workflow_dispatch' || inputs.recreate) && !(github.event_name == 'repository_dispatch' && ((env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true')))
        working-directory: infrastructure/tofu/envs/staging
        run: tofu destroy -auto-approve

      - name: OpenTofu Plan & Apply (neuen Stack aufbauen)
        working-directory: infrastructure/tofu/envs/staging
        env:
          GUARDED_IN_PLACE: ${{ (github.event_name == 'repository_dispatch' && ((env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded) }}
        run: |
          set -euo pipefail
          tofu plan -out=tfplan
          # Only component-image dispatches may reuse the VM. Fail closed if
          # the actual plan wants to delete or replace *any* infrastructure.
          # Do not print the JSON plan: it can contain sensitive values.
          if [ "$GUARDED_IN_PLACE" = true ]; then
            tofu show -json tfplan | python3 ../../../../scripts/check_inplace_plan.py \
              || { echo '::error::In-place update would delete or replace infrastructure; use an explicitly reviewed rebuild.'; exit 1; }
          fi
          tofu apply tfplan
          {
            echo "VM_IP=$(tofu output -raw vm_ip)"
            echo "VM_IPV4=$(tofu output -raw vm_ipv4)"
            echo "VM_IPV4_GATEWAY=$(tofu output -raw vm_ipv4_gateway)"
            echo "VM_IPV4_MAC=$(tofu output -raw vm_ipv4_mac)"
          } >> "$GITHUB_ENV"

      # Ohne diesen Schritt ist der Neuaufbau wertlos: die neue VM bekommt eine
      # neue IPv6-Adresse, der AAAA-Record zeigt aber weiter auf die alte, und
      # unter dem Hostnamen ist nichts mehr erreichbar. Genau so ist der erste
      # automatische Deploy am 18.09.2026 geendet.
      #
      # Das Runbook fuehrte den DNS-Eintrag als Schritt "nur beim ersten Mal" -
      # unter der Annahme, die VM bleibe bestehen. Seit sie das nicht mehr tut,
      # gehoert der Eintrag in jeden Lauf.
      #
      # Caddy benutzt denselben TSIG-Schluessel fuer den TXT-Record der
      # dns-01-Pruefung. Er darf nachweislich auch AAAA schreiben.
      #
      # Die Werte kommen aus der .env des Stands. Fuer develop ist das der
      # abgeleitete Hostname, der Schluessel ist derselbe - beide Namen liegen
      # in derselben Zone.
      - name: DNS-Eintrag auf die neue VM zeigen lassen
        run: |
          set -euo pipefail
          umask 077
          envfile="$STAND_ENV_FILE"
          keyfile=$(mktemp)
          # Die Schluesseldatei verschwindet auch dann, wenn nsupdate abbricht.
          # Die .env des Stands raeumt der letzte Schritt weg.
          trap 'rm -f "$keyfile"' EXIT

          wert() { grep -E "^$1=" "$envfile" | head -1 | cut -d= -f2- || true; }
          hostname=$(wert APP_HOSTNAME)
          keyname=$(wert DNS_TSIG_KEY_NAME)
          keysecret=$(wert DNS_TSIG_KEY)
          # DNS_SERVER und DNS_TSIG_KEY_ALG stehen ueblicherweise nicht in der
          # .env - die Defaults hier sind dieselben wie in
          # docker-compose.staging.yml, damit Caddy und dieser Schritt nicht
          # auseinanderlaufen koennen.
          server=$(wert DNS_SERVER); server=${server:-ns.cloud-ns.dhbw-mannheim.de.:53}
          alg=$(wert DNS_TSIG_KEY_ALG); alg=${alg:-hmac-sha512}
          nshost=${server%:*}
          nsport=${server##*:}

          for v in hostname keyname keysecret; do
            if [ -z "${!v}" ]; then
              echo "::error::$v fehlt in STAGING_ENV_FILE - der DNS-Eintrag kann nicht gesetzt werden." >&2
              exit 1
            fi
          done

          # Der Schluessel geht ueber eine Datei, nicht ueber -y: die
          # Kommandozeile waere auf dieser dauerhaften Maschine fuer jeden
          # sichtbar, der zur selben Zeit `ps` aufruft.
          cat > "$keyfile" <<KEY
          key "$keyname" {
              algorithm $alg;
              secret "$keysecret";
          };
          KEY

          # Die Zone wird nicht geraten, sondern beim autoritativen Server
          # erfragt. Ein falscher zone-Eintrag laesst nsupdate mit NOTZONE
          # scheitern, und das sieht aus wie ein Rechteproblem.
          zone=$(dig +noall +authority +answer SOA "$hostname" @"$nshost" -p "$nsport" \
                 | awk '$4=="SOA"{print $1; exit}')
          if [ -z "$zone" ]; then
            echo "::error::Zu $hostname liess sich keine Zone ermitteln." >&2
            exit 1
          fi
          echo "Zone: $zone"
          echo "Setze $hostname auf $VM_IP"

          nsupdate -k "$keyfile" <<UPDATE
          server $nshost $nsport
          zone $zone
          update delete $hostname. AAAA
          update add $hostname. 300 AAAA $VM_IP
          send
          UPDATE

          # Nachsehen statt hoffen. Gefragt wird der autoritative Server
          # direkt, damit kein Zwischenspeicher eine alte Antwort liefert.
          gesetzt=$(dig +short AAAA "$hostname" @"$nshost" -p "$nsport" | head -1)
          if [ "$gesetzt" != "$VM_IP" ]; then
            echo "::error::DNS zeigt auf '$gesetzt', erwartet war '$VM_IP'." >&2
            exit 1
          fi
          echo "AAAA-Record steht auf $gesetzt."
          echo "APP_HOSTNAME=$hostname" >> "$GITHUB_ENV"

      # OpenTofu meldet die VM als fertig, sobald Nova sie als ACTIVE fuehrt.
      # Bis der SSH-Dienst darin antwortet, vergehen noch einige Sekunden -
      # ohne dieses Warten scheitert Ansible am ersten Verbindungsversuch.
      - name: Auf SSH der neuen VM warten
        run: |
          for i in $(seq 1 60); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                   -i ~/.ssh/openstack-key "ubuntu@${VM_IP}" true 2>/dev/null; then
              echo "SSH ist nach ${i} Versuchen da."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Die neue VM antwortet nach 10 Minuten nicht auf SSH." >&2
          exit 1

      - name: Ansible-Abhaengigkeiten installieren
        working-directory: infrastructure/ansible
        run: |
          ansible-galaxy role install -r requirements.yml -p roles_external
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible-Inventar erzeugen
        working-directory: infrastructure/ansible
        run: |
          # Leer heisst: tofu hat keinen Output geliefert. ansible-playbook
          # wuerde dann mit "no hosts matched" gruen durchlaufen und nichts
          # ausrollen - ein gruener Lauf ohne Deploy ist schlimmer als ein roter.
          if [ -z "$VM_IP" ]; then
            echo "::error::VM_IP ist leer - tofu output hat nichts geliefert." >&2
            exit 1
          fi
          # Die Adresse steht in ansible_host hinter einem Alias, nicht als
          # Hostname selbst: eckige Klammern um ein IPv6-Literal liest das
          # ini-Plugin als Host-Range und scheitert mit "host range must be
          # begin:end". Ein Alias umgeht die Frage und ist fuer IPv4 und IPv6
          # gleich.
          cat > inventory.ini <<EOF
          [docker_vm]
          staging ansible_host=${VM_IP} ansible_user=ubuntu
          EOF
          echo "Inventar:" && cat inventory.ini

      - name: Ansible Playbook ausfuehren
        working-directory: infrastructure/ansible
        env:
          # Bei einem frisch aufgebauten Stack existieren noch keine Benutzer,
          # Kurse oder Apps - der Keycloak-Realm bringt nur das Dienstkonto des
          # Backends mit. Nach einem destroy/apply muss also geseedet werden,
          # sonst steht der App-Store leer da. Das Skript ist idempotent.
          #
          # Die Bedingung ist absichtlich herum: `event == 'workflow_dispatch'
          # && inputs.seed || 'true'` waere falsch. GitHubs || liefert den
          # ersten wahrheitswerthaltigen Operanden, und bei seed=false ergaebe
          # `false || 'true'` wieder 'true' - die Wahl im Formular haette keine
          # Wirkung. So herum steht der Default links und wird nur dann
          # ausgewertet, wenn es kein workflow_dispatch ist.
          SEED: ${{ github.event_name == 'repository_dispatch' && ((env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true')) && 'false' || (github.event_name != 'workflow_dispatch' && 'true' || inputs.seed) }}
          GUARDED_UPDATES: ${{ (env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded) }}
          IN_PLACE_UPDATE: ${{ (github.event_name == 'repository_dispatch' && ((env.STAND == 'develop' && vars.GUARDED_STAGING_UPDATES == 'true') || (env.STAND == 'main' && vars.GUARDED_MAIN_UPDATES == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_guarded) }}
        # Das Playbook liest die .env aus STAGING_ENV_FILE - der Name bleibt,
        # der Inhalt ist die .env des Stands. caddy_backup_file kennt ein
        # Playbook von vor ADR 0014 nicht; es nimmt dann den alten Pfad, und
        # der ist der von main.
        run: |
          STAGING_ENV_FILE="$(cat "$STAND_ENV_FILE")" \
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key \
            -e "seed_data=${SEED}" \
            -e "guarded_updates_enabled=${GUARDED_UPDATES}" \
            -e "in_place_update=${IN_PLACE_UPDATE}" \
            -e "caddy_backup_file=${CADDY_BACKUP}" \
            -e "secondary_ipv4=${VM_IPV4}" \
            -e "secondary_gateway=${VM_IPV4_GATEWAY}" \
            -e "secondary_mac=${VM_IPV4_MAC}" \
            staging.yml

      - name: Wartung nach erfolgreichem Backend-Healthcheck beenden
        if: env.MAINTENANCE_OWNER != ''
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 60); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                 -i ~/.ssh/openstack-key "ubuntu@$VM_IP" \
                 'test "$(docker inspect --format "{{.State.Health.Status}}" backend-prod)" = healthy && docker exec backend-prod python -c "import app.services.maintenance_control"' \
                 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "::error::Backend not ready; maintenance stays enabled (owner $MAINTENANCE_OWNER)."
            exit 1
          fi
          bash scripts/maintenance-operator.sh end "$MAINTENANCE_DB" "$MAINTENANCE_OWNER"

      - name: Ergebnis
        if: success()
        run: |
          {
            echo "### Stand ${STAND} neu aufgebaut"
            echo ""
            echo "**https://${APP_HOSTNAME}**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stand | ${STAND} (Images \`:${IMAGE_TAG}\`) |"
            echo "| VM-Adresse | \`${VM_IP}\` |"
            echo "| Ausgeloest durch | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fehlerdiagnose ohne Rohlogs
        if: failure() && env.MAINTENANCE_OWNER != ''
        run: |
          {
            echo '### Geschuetzter Deploy fehlgeschlagen'
            echo "Wartungseigentuemer: ${MAINTENANCE_OWNER}"
            echo 'Sperrenstatus, Fehler und Auftraege vor einem neuen Versuch pruefen.'
            if [ -z "${VM_IP:-}" ]; then
              echo 'Keine neue VM-Adresse verfuegbar.'
            else
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                -i ~/.ssh/openstack-key "ubuntu@$VM_IP" \
                'for name in backend-prod worker-prod frontend-prod; do
                   state=$(docker inspect --format "{{.State.Status}}" "$name" 2>/dev/null || true)
                   case "$state" in running|restarting|exited|created|dead) ;; *) state=unavailable ;; esac
                   printf "%s: %s\n" "$name" "$state"
                 done' 2>/dev/null || echo 'VM oder Docker fuer Diagnose nicht erreichbar.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Laeuft auch nach einem Abbruch. Der Runner ist eine dauerhafte Maschine,
      # kein wegwerfbarer Container - was hier liegen bleibt, bleibt liegen.
      - name: Sensible Dateien entfernen
        if: always()
        run: |
          rm -f ~/.ssh/openstack-key ~/.ssh/openstack-key.pub
          rm -f infrastructure/ansible/inventory.ini
          rm -f "$RUNNER_TEMP/stand.env"
          echo "Zugangsdaten des Laufs entfernt."
