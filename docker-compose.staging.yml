# ================================================================
# Staging stack — STANDALONE, GHCR-pulled, version-pinnable.
#
# Pulls pre-built images from GHCR and runs the full stack:
# postgres (app DB), keycloak - der Terraform-State liegt ausserhalb (ADR-0005)
# (+ its postgres), rabbitmq, redis, backend, worker, frontend,
# caddy (TLS reverse proxy).
#
#   docker compose -f docker-compose.staging.yml up -d
#
# Difference vs ``docker-compose.prod.yml``: the three repo-owned
# services (backend / worker / frontend) use ``${SERVICE_VERSION:-latest}``
# so a staging operator can pin a specific commit SHA / tag for a
# reproducible rollout before promoting to prod. Prod uses hardcoded
# ``:latest`` with ``pull_policy: always`` — no pinning, just CD.
#
# DB migrations are NOT part of this compose file — the Ansible
# playbook runs ``docker exec backend-prod python -m alembic upgrade
# head`` after the stack is up so failures land in the playbook log
# instead of being buried in compose output.
#
# This file mirrors docker-compose.dev.yml service-for-service.
# Differences vs dev:
#   - Pulls GHCR images instead of building locally.
#   - Source-mount and ssh-key-mount removed (staging uses GIT_ACCESS_TOKEN).
#   - pgadmin removed.
#   - Required env vars use ${VAR:?required} so a missing .env on the
#     VM stops compose-up immediately (e.g. SECRET_KEY, APP_BASE_URL,
#     CORS_ORIGINS — vars that have unsafe localhost / dev defaults
#     in dev.yml).
#   - Adds resource limits and json-file log rotation per service.
#   - caddy terminates TLS on :443 and reverse-proxies to frontend,
#     backend (/api/), and keycloak (/realms/, /resources/, /admin/,
#     /js/). Frontend, backend and keycloak no longer expose ports
#     directly to the host.
#   - Unlike prod, which still runs nginx with a self-signed
#     certificate, staging gets a browser-trusted certificate from
#     DHBW's ACME endpoint and renews it without a cron job. This
#     needs APP_HOSTNAME to be a DNS name resolving to the VM.
# ================================================================
services:
  # ----------------------------------------------------------------
  # PostgreSQL Database (application)
  # ----------------------------------------------------------------
  # postgres (Anwendungsdaten) und keycloak-postgres liegen seit ADR-0006
  # ausserhalb dieser VM, auf derselben Maschine wie der Terraform-State.
  #
  # Der Grund ist derselbe wie in ADR-0005, nur teurer: hier stehen die
  # Deployments, Benutzer, Kurse und Zugangsdaten. Am 19.09.2026 hat ein
  # Merge sie geloescht - die Windows-VMs liefen weiter, aber die
  # Oberflaeche kannte sie nicht mehr, obwohl ihre Terraform-States
  # gerettet waren.

  # ----------------------------------------------------------------
  # PostgreSQL Database (Terraform Remote State)
  # ----------------------------------------------------------------
  # Worker-only Postgres for Terraform's `pg` backend. Deliberately
  # isolated from the application DB: the worker must never reach
  # the backend's data, only its own state store. One schema per
  # deployment (`deployment_<uuid>`) keeps the locking/state surface
  # tight. Not exposed on the host — internal to worker-network.
  # postgres-tfstate stand hier und laeuft jetzt ausserhalb dieser VM.
  #
  # Der Grund steht in ADR-0005: die Datenbank hielt den Terraform-State
  # jedes App-Deployments - und damit die einzige Kenntnis davon, welche VMs
  # die Plattform angelegt hat, samt der Passwoerter der Studierenden. Sie
  # lief dabei auf der VM, die der Staging-Deploy selbst verwaltet. Seit
  # ADR-0003 reisst jeder Merge diese VM ab, seit ADR-0004 gibt es kein
  # Volume mehr, das etwas hinuebertraegt.
  #
  # Ein Merge loeschte damit das Gedaechtnis der Plattform. Die App-VMs
  # liefen weiter - sie stehen in einem anderen State als envs/staging und
  # werden vom destroy nicht angesprochen -, waren aber nicht mehr
  # verwaltbar. Bei Linux-Apps hiess das ein paar Minuten Neuaufbau, bei
  # Windows-Apps 30 bis 60 Minuten je Deployment.
  #
  # Die Datenbank laeuft jetzt auf der Runner-VM, die dieses Terraform nicht
  # verwaltet - dieselbe Ueberlegung wie beim Staging-State in ADR-0003.
  # Adresse und Zugang kommen ueber TFSTATE_DB_HOST aus der .env.

  # ----------------------------------------------------------------
  # Keycloak database
  # ----------------------------------------------------------------
  # ----------------------------------------------------------------
  # Keycloak (Identity Provider)
  # ----------------------------------------------------------------
  # Imports the `dhbw` realm from keycloak/realm-export.json on first
  # boot (skipped once the realm exists in the persistent DB volume).
  #
  # NOTE: uses start-dev (HTTP, no hostname enforcement) — fine for a
  # staging VM reached over http://<ip>:8080. For real production
  # behind TLS, switch to `start` and set KC_HOSTNAME to the public URL.
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-prod
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST:-10.200.1.55}:${KEYCLOAK_DB_PORT:-5432}/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Tell Keycloak it sits behind a TLS-terminating proxy so it
      # builds HTTPS redirect URIs correctly from X-Forwarded-Proto.
      KC_PROXY: "edge"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # Kein depends_on mehr: die einzige Abhaengigkeit war
    # keycloak-postgres, und die Datenbank liegt seit ADR-0006 ausserhalb
    # dieser Compose-Datei. Ein leerer depends_on-Block ist ungueltig -
    # Compose lehnt ihn ab mit "depends_on must be a array".
    networks:
      - keycloak-network
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # RabbitMQ (Celery broker)
  # ----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-prod
    hostname: rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ----------------------------------------------------------------
  # Redis — Celery RESULT backend (broker is RabbitMQ above).
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-prod
    hostname: redis
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Backend API (FastAPI)
  # ----------------------------------------------------------------
  # Migrations are applied by the Ansible playbook AFTER compose-up
  # (`docker exec backend-prod python -m alembic upgrade head`). Do
  # not re-introduce a backend-migrate init-container here — that
  # pattern hides migration failures inside the compose output.
  backend:
    image: ghcr.io/${IMAGE_NAMESPACE:-dhbw-appstore}/backend:${BACKEND_VERSION:-latest}
    container_name: backend-prod
    # The backend image's venv is built at /build/.venv and copied to
    # /app/.venv, so the console scripts (`uvicorn`, `alembic`) carry a
    # stale build-time shebang (#!/build/.venv/bin/python) that doesn't
    # resolve at runtime. Invoke via `python -m` to bypass the broken
    # script. The Ansible playbook does the same for `alembic upgrade
    # head` after compose-up.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-10.200.1.55}:${DB_PORT:-5432}/${DB_NAME}

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}

      # Celery (broker = RabbitMQ, result backend = Redis)
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Keycloak
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dhbw}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-appstore-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}

      # Git — optional since the GitHub App; still needed for GitLab repositories.
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

      # Email (Gmail SMTP) — used by the post-deploy notify hook in
      # celery_event_listener.py. SMTP_ENABLED is the explicit
      # kill-switch (default false): even with SMTP_USER/SMTP_PASSWORD
      # populated, mail delivery only happens when SMTP_ENABLED=true.
      # Use it to keep credentials in .env for later but turn delivery
      # off in dev / CI / on demo days without scrubbing the creds.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Click-n-Deploy}

      # LTI 1.3 - Moodle ist die Platform, dieser App Store das Tool.
      #
      # Alle Werte haben einen Standard, keiner ist erzwungen: LTI_ENABLED
      # ist der Kippschalter, und ist er aus, antworten die /lti-Endpunkte
      # mit 503, ohne dass sonst etwas anders laeuft. Ein Stack ohne
      # registriertes Moodle startet damit unveraendert.
      #
      # Die sechs Registrierungswerte stellt Moodle aus - siehe
      # docs/moodle-infrastruktur.md und moodle/cli/register_lti_tool.php.
      LTI_ENABLED: ${LTI_ENABLED:-false}
      LTI_PLATFORM_ISSUER: ${LTI_PLATFORM_ISSUER:-}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-}
      LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID:-}
      LTI_JWKS_URL: ${LTI_JWKS_URL:-}
      LTI_AUTH_LOGIN_URL: ${LTI_AUTH_LOGIN_URL:-}
      LTI_TOKEN_URL: ${LTI_TOKEN_URL:-}

      # Der private Schluessel dieses Tools und das Geheimnis der eigenen
      # Session. Beide gehoeren in die .env, nicht hierher.
      LTI_PRIVATE_KEY_B64: ${LTI_PRIVATE_KEY_B64:-}
      LTI_SESSION_SECRET: ${LTI_SESSION_SECRET:-}

      # Eigene Redis-Datenbank, nicht die von Celery: hier liegen state
      # und nonce zwischen Login und Launch.
      LTI_REDIS_URL: ${LTI_REDIS_URL:-redis://redis:6379/1}

      # Zielseiten im Frontend. Die Standardwerte in config.py zeigen auf
      # localhost:5173 - auf Staging waere das die Maschine des Nutzers.
      LTI_LAUNCH_REDIRECT_URL: ${LTI_LAUNCH_REDIRECT_URL:-${APP_BASE_URL}/lti/callback}
      LTI_LINK_REDIRECT_URL: ${LTI_LINK_REDIRECT_URL:-${APP_BASE_URL}/lti/link}

      # Wie lange eine angefangene Deep-Link-Auswahl offen bleibt. Moodle
      # uebergibt seine Rueckgabe-URL beim Anlegen der Aktivitaet; die
      # Auswahl trifft danach ein Mensch. Einmal einloesbar.
      LTI_DEEP_LINK_TTL_MINUTES: ${LTI_DEEP_LINK_TTL_MINUTES:-30}

      LTI_TRUST_INSTRUCTOR_ROLE: ${LTI_TRUST_INSTRUCTOR_ROLE:-false}

      # Public base URL of the frontend, used in owner-summary mails
      # to deep-link back to the deployment detail page.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}

      # Application
      DEBUG: "False"
      APP_NAME: ${APP_NAME:-Backend API}

      # Server
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${BACKEND_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - backend_git_repos:/tmp/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------
  # Worker Service (Celery)
  # ----------------------------------------------------------------
  # Worker has NO access to the application DB — it only talks to
  # RabbitMQ/Redis (Celery) and postgres-tfstate (Terraform state).
  worker:
    image: ghcr.io/${IMAGE_NAMESPACE:-dhbw-appstore}/worker:${WORKER_VERSION:-latest}
    container_name: worker-prod
    environment:
      # Celery (broker = RabbitMQ, result backend = Redis)
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # OpenStack credential decryption (must match backend)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}

      # Terraform pg backend — isolated DB, NOT the application DB.
      # Worker uses one schema per deployment (deployment_<uuid>).
      # Zeigt auf die Datenbank ausserhalb dieser VM, siehe ADR-0005.
      # TFSTATE_DB_HOST gehoert in die .env; der Default ist die Runner-VM
      # im Projektnetz. Faellt der Host weg, kann der Worker weder anlegen
      # noch loeschen - das ist der Preis der Auslagerung und steht so auch
      # im ADR.
      TFSTATE_DATABASE_URL: postgresql://${TFSTATE_DB_USER}:${TFSTATE_DB_PASSWORD}@${TFSTATE_DB_HOST:-10.200.1.55}:${TFSTATE_DB_PORT:-5432}/${TFSTATE_DB_NAME}?sslmode=disable

      # Git — optional since the GitHub App; still needed for GitLab repositories.
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

      # Application
      DEBUG: "False"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Kein depends_on fuer den Terraform-State mehr: die Datenbank liegt
      # ausserhalb dieser Compose-Datei und kann von hier aus nicht
      # abgewartet werden. Ist sie nicht erreichbar, scheitert das erste
      # Deployment mit einem Verbindungsfehler statt beim Start.
    volumes:
      - worker_git_repos:/tmp/repos
    networks:
      - worker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------
  # Caddy (TLS reverse proxy)
  # Terminates HTTPS on :443, redirects :80→:443, and proxies:
  #   /          → frontend:8080
  #   /api/      → backend:8000   (strips /api/ prefix)
  #   /realms/, /resources/, /admin/, /js/ → keycloak:8080
  #
  # Replaces nginx. The certificate is obtained from DHBW's ACME endpoint
  # rather than generated by Ansible, so it is browser-trusted and renews
  # itself. Port 80 must stay open for the ACME HTTP-01 challenge.
  # ----------------------------------------------------------------
  caddy:
    # Built rather than pulled: the stock image has no DNS provider modules,
    # and dns-01 is the only challenge type that works for an IPv6-only host
    # here. See caddy/Dockerfile.
    build:
      context: ./caddy
    image: appstore-caddy:rfc2136
    container_name: caddy-prod
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:?APP_HOSTNAME is required}
      ACME_CA_URL: ${ACME_CA_URL:-https://certificates.dhbw.cloud/directory}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      # TSIG credentials for the dns-01 challenge, from the zone's TLS
      # certificates page in the self-service UI.
      DNS_TSIG_KEY_NAME: ${DNS_TSIG_KEY_NAME:?DNS_TSIG_KEY_NAME is required}
      DNS_TSIG_KEY_ALG: ${DNS_TSIG_KEY_ALG:-hmac-sha512}
      DNS_TSIG_KEY: ${DNS_TSIG_KEY:?DNS_TSIG_KEY is required}
      DNS_SERVER: ${DNS_SERVER:-ns.cloud-ns.dhbw-mannheim.de.:53}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key live here. Losing this
      # volume means re-issuing on every deploy, which runs into the CA's
      # rate limits - it must persist across redeploys.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - frontend-network
      - backend-network
      - keycloak-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------
  # Frontend (Vue 3 SPA, served by nginx in the image)
  # ----------------------------------------------------------------
  frontend:
    image: ghcr.io/${IMAGE_NAMESPACE:-dhbw-appstore}/frontend:${FRONTEND_VERSION:-latest}
    container_name: frontend-prod
    environment:
      NODE_ENV: production
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL is required}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-dhbw}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-appstore-frontend}
      VITE_APP_URL: ${VITE_APP_URL:?VITE_APP_URL is required}
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  rabbitmq_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  backend_git_repos:
    driver: local
  # Issued certificates and the ACME account key. Deleting this volume forces
  # re-issuance on the next start, which the CA rate-limits.
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  worker_git_repos:
    driver: local

# ----------------------------------------------------------------
# Networks
# ----------------------------------------------------------------
networks:
  frontend-network:
    driver: bridge
    name: frontend-network-prod
  backend-network:
    driver: bridge
    name: backend-network-prod
  worker-network:
    driver: bridge
    name: worker-network-prod
  keycloak-network:
    driver: bridge
    name: keycloak-network-prod
