---
- name: Moodle als LTI-Plattform einrichten
  hosts: moodle_vm
  become: yes
  gather_facts: yes

  vars:
    docker_users: ["ubuntu"]
    docker_install_compose: true
    project_root: "/home/ubuntu/moodle"

  roles:
    - geerlingguy.docker

  tasks:
    - name: Projektverzeichnis anlegen
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: ubuntu
        mode: '0755'

    # Nur die Dateien, die Moodle braucht. Der Compose-Stack des App Stores
    # hat hier nichts verloren.
    - name: Compose-Datei und Caddy-Konfiguration kopieren
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ project_root }}/{{ item.dest }}"
        owner: ubuntu
        mode: '0644'
      loop:
        - { src: "../../docker-compose.moodle-infra.yml", dest: "docker-compose.moodle-infra.yml" }
        - { src: "../../moodle/Caddyfile", dest: "moodle/Caddyfile" }
        - { src: "../../caddy/Dockerfile", dest: "caddy/Dockerfile" }
        - { src: "../../moodle/cli/register_lti_tool.php", dest: "moodle/cli/register_lti_tool.php" }

    # MOODLE_ENV_FILE kommt als Secret aus dem Workflow. Rechte 0600, weil
    # darin das Administratorpasswort und der TSIG-Schluessel stehen.
    - name: .env schreiben
      ansible.builtin.copy:
        content: "{{ lookup('env', 'MOODLE_ENV_FILE') }}"
        dest: "{{ project_root }}/.env"
        owner: ubuntu
        mode: '0600'
      no_log: true

    - name: Stack starten
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.moodle-infra.yml up -d --remove-orphans
        chdir: "{{ project_root }}"
      changed_when: true

    # Der erste Start dauert lange: Bitnami installiert Moodle, legt die
    # Datenbank an und fuehrt die Migrationen aus. Vor dem Ende davon hat eine
    # LTI-Registrierung keinen Sinn.
    - name: Auf Moodle warten
      ansible.builtin.uri:
        url: "http://localhost:8080/login/index.php"
        status_code: [200, 303]
      register: moodle_bereit
      retries: 60
      delay: 15
      until: moodle_bereit.status in [200, 303]
      delegate_to: "{{ inventory_hostname }}"
      failed_when: false

    - name: Registrierungsskript in den Container legen
      ansible.builtin.command:
        cmd: >-
          docker cp {{ project_root }}/moodle/cli/register_lti_tool.php
          moodle:/opt/bitnami/moodle/local_register_lti_tool.php
      changed_when: true
      when: moodle_bereit.status | default(0) in [200, 303]
