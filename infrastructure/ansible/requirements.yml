---
# External Ansible dependencies for the deploy playbooks. Installed in CI via
# `ansible-galaxy ... -r requirements.yml`. The geerlingguy.docker role is NOT
# vendored in the repo — it is fetched from Galaxy at deploy time, so this file
# is the single source of truth. Pin versions for reproducibility.

roles:
  - name: geerlingguy.docker
    version: 7.1.0

collections:
  - name: community.docker  # docker_compose_v2
  - name: ansible.posix     # synchronize, mount
  # filesystem, used by staging.yml to prepare the Cinder data volume. Declared
  # explicitly even though the job image already has it: it ships as part of the
  # full `ansible` package rather than being asked for, so it would disappear
  # unannounced if that image ever moved to ansible-core.
  - name: community.general
