# Run only with a unique -p project name and a dedicated, disposable DB.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experiment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experiment"]
      interval: 1s
      timeout: 2s
      retries: 30
  test:
    image: deployment-backend:latest
    working_dir: /app
    entrypoint: ["/app/.venv/bin/python", "-m", "pytest"]
    environment:
      DATABASE_URL: postgresql://experiment:experiment@db:5432/experiment
      TEST_DATABASE_URL: postgresql://experiment:experiment@db:5432/experiment
      DISABLE_BACKGROUND_TASKS: "1"
      CREDENTIAL_ENCRYPTION_KEY: "Q1PNlFd4It9oQPtjCcXcmB7wGDkY4w8KwpIRNSF4u7U="
      MAINTENANCE_PSQL_MODE: direct
      PGHOST: db
      PGUSER: experiment
      PGPASSWORD: experiment
    volumes:
      - ../../../backend-deploy-experiment:/app
      - ../../scripts:/deployment/scripts:ro
      - backend-test-venv:/app/.venv:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  backend-test-venv:
    external: true
    name: ${BACKEND_TEST_VENV}
